[package]
name = "plume-app"
version = "0.1.0"
edition = "2021"
description = "Plume pour Windows, Mac et Linux : application de bureau (pages intégrées au programme)"
license = "MIT"
publish = false

[[bin]]
name = "Plume"
path = "src/main.rs"

[dependencies]
plume-serveur = { path = "../serveur" }
serde_json = "1"
tao = "0.37"
wry = "0.57"
tiny_http = "0.12"

[target.'cfg(not(windows))'.dependencies]
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
