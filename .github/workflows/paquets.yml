# Compile Plume pour Mac et Linux (x86_64 et ARM), avec le serveur web.
# Lancement : pousser une étiquette de version (git tag v2026.11.23 && git push origin v2026.11.23).
# Les fichiers produits sont récupérés à la main, rien n'est publié automatiquement.
name: Paquets
on:
  push:
    tags: ['v*']

env:
  VERSION: ${{ github.ref_name }}
  CARGO_TERM_COLOR: never

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { os: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev xvfb imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation
        run: |
          cargo build --release --manifest-path app-pc/Cargo.toml
          cargo build --release --manifest-path serveur/Cargo.toml
      - name: Essai (Plume s'ouvre et affiche l'accueil)
        run: |
          mkdir -p sortie
          xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
            app-pc/target/release/Plume & p=$!
            sleep 15
            import -window root sortie/essai-linux-${{ matrix.arch }}.png
            kill -0 $p || { echo "Plume s est arrêté"; exit 1; }
            kill $p'
      - name: Paquets
        run: bash app-pc/paquets/linux.sh ${{ matrix.arch }} ${{ matrix.deb }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: sortie/*

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compilation (Apple Silicon et Intel)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t --manifest-path app-pc/Cargo.toml
            cargo build --release --target $t --manifest-path serveur/Cargo.toml
          done
      - name: Paquets
        run: bash app-pc/paquets/mac.sh
      - name: Essai (Plume s'ouvre et affiche l'accueil)
        continue-on-error: true
        run: |
          hdiutil attach sortie/Plume.dmg -mountpoint /tmp/plume
          /tmp/plume/Plume.app/Contents/MacOS/Plume & p=$!
          sleep 15
          screencapture -x sortie/essai-mac.png
          kill -0 $p
          kill $p
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: sortie/*
